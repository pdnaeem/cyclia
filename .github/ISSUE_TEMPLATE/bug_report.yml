name: Bug report
description: Something does not work or a result looks wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve Cyclia. Please do not attach ecoinvent data or other licensed database content.
  - type: input
    id: version
    attributes:
      label: Cyclia version
      description: Shown at the bottom left of the app or in Help > About
      placeholder: "1.4.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows 11, Windows 10, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Load the demo\n2. Go to step 4\n3. ..."
  - type: textarea
    id: diag
    attributes:
      label: Diagnostics
      description: Help > About > "Export diagnostics for support" creates a file with the error log and no project data. Attach it here.
