# Builds Cyclia installers for Windows, macOS and Linux.
#  - Run by hand from the Actions tab: installers appear as downloadable artifacts.
#  - Push a tag such as v1.1.0: installers are also published as a GitHub Release, which the app's
#    auto-updater reads. Set "owner" in app/package.json (build.publish) to your GitHub user first.
# Optional repository secrets for signed builds (unsigned builds work without them):
#   WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD           Windows code-signing certificate (.pfx as base64) and password
#   MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD           Apple Developer ID certificate and password
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   for notarization (then set mac.notarize to true)
name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis
            csc_link: WIN_CSC_LINK
            csc_pass: WIN_CSC_KEY_PASSWORD
          - os: macos-latest
            target: --mac dmg zip
            csc_link: MAC_CSC_LINK
            csc_pass: MAC_CSC_KEY_PASSWORD
          - os: ubuntu-latest
            target: --linux AppImage deb
            csc_link: NONE
            csc_pass: NONE
    runs-on: ${{ matrix.os }}
    # without a limit a hung step runs for GitHub's 6 hours and the job then shows as "cancelled"
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build engine (runs the test suite first)
        timeout-minutes: 60
        run: python engine/build-engine.py
      - name: World map
        run: |
          python engine/tools/apply_credits.py
          python engine/tools/fetch_world.py
      - name: Install Electron and builder
        working-directory: app
        run: npm install
      - name: Free the disk image tools (macOS)
        if: runner.os == 'macOS'
        run: |
          # Spotlight indexing and XProtect hold new disk images open, the usual cause of "Resource busy" and of
          # hdiutil hanging
          sudo mdutil -a -i off || true
          sudo pkill -9 XProtect || true
      - name: Build installer
        working-directory: app
        shell: bash
        timeout-minutes: 75
        run: |
          # each attempt gets 20 minutes; a hung hdiutil is stopped and retried instead of blocking the job
          run_limited() { if [ "$RUNNER_OS" = "macOS" ]; then perl -e 'alarm shift; exec @ARGV' 1200 "$@"; else "$@"; fi; }
          EXTRA=""
          if [ -z "$CSC_LINK" ]; then
            # no certificate: build unsigned (an empty CSC_LINK makes electron-builder fail)
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            # macOS on Apple silicon needs at least an ad-hoc signature to start
            if [ "$RUNNER_OS" = "macOS" ]; then EXTRA="-c.mac.identity=-"; fi
          fi
          # hdiutil on GitHub's macOS runners sometimes fails with "Resource busy" while making the .dmg: retry
          n=0
          until run_limited npx electron-builder ${{ matrix.target }} $EXTRA --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}; do
            n=$((n+1))
            if [ "$RUNNER_OS" != "macOS" ] || [ $n -ge 3 ]; then echo "electron-builder failed"; exit 1; fi
            echo "electron-builder failed on macOS, retry $n of 2 in 30 s"
            hdiutil info || true
            # detach any image left mounted by the failed attempt
            for v in /Volumes/Cyclia*; do [ -d "$v" ] && hdiutil detach -force "$v" || true; done
            rm -f dist/*.dmg dist/*.blockmap
            sleep 30
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets[matrix.csc_link] }}
          CSC_KEY_PASSWORD: ${{ secrets[matrix.csc_pass] }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: cyclia-${{ matrix.os }}
          path: |
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/*.AppImage
            app/dist/*.deb
          if-no-files-found: error
