<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cyclia</title>
<style>
  @font-face { font-family: "Inter"; font-weight: 400; src: url("ui/fonts/Inter-Regular.woff") format("woff"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url("ui/fonts/Inter-SemiBold.woff") format("woff"); }
  html, body { margin: 0; height: 100%; }
  body { font: 14px/1.45 "Inter", "Segoe UI", -apple-system, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased;
    color: #fff; background: #12271f; overflow: hidden; position: relative; user-select: none;
    -webkit-app-region: drag; display: grid; grid-template-rows: 1fr auto; }
  .top { display: flex; align-items: center; gap: 22px; padding: 44px 44px 0; }
  body::after { content: ""; position: absolute; right: -120px; top: -140px; width: 420px; height: 420px; border-radius: 50%;
    border: 56px solid rgba(255,255,255,.035); pointer-events: none; }
  img { width: 76px; height: 76px; border-radius: 17px; box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 10px 30px rgba(0,0,0,.3); }
  h1 { margin: 0; font-size: 38px; letter-spacing: -0.025em; font-weight: 600; }
  .tag { color: #93aca3; margin-top: 2px; }
  .status { padding: 0 44px; margin-top: 28px; color: #93aca3; font-size: 13px; display: flex; align-items: center; gap: 10px; }
  .bar { position: relative; height: 3px; width: 120px; background: rgba(255,255,255,.18); border-radius: 2px; overflow: hidden; }
  .bar::after { content: ""; position: absolute; inset: 0; width: 40%; background: rgba(255,255,255,.75); border-radius: 2px;
    animation: slide 1.3s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; } }
  footer { display: flex; justify-content: space-between; align-items: flex-end; padding: 0 44px 28px; gap: 16px; }
  .by { font-size: 12px; color: #bcd3cb; }
  .by b { display: block; color: #fff; font-size: 15px; font-weight: 600; margin-top: 2px; }
  .by span { display: block; margin-top: 2px; }
  .lic { font-size: 11.5px; color: #9fbcb2; text-align: right; }
</style>
</head>
<body>
  <div>
    <div class="top">
      <img src="ui/icon.png" alt="">
      <div><h1>Cyclia</h1><div class="tag">Life cycle assessment for students and researchers</div></div>
    </div>
    <div class="status"><div class="bar"></div><span>Starting the calculation engine</span></div>
  </div>
  <footer>
    <div class="by">Created by<b id="who">Naeem Ur Rehman</b><span id="role"></span></div>
    <div class="lic">Free and open source<br>MIT licence<br><span id="ver"></span></div>
  </footer>
<script src="ui/credits.js"></script>
<script>
  const c = window.CREDITS || {};
  if (c.display_name) document.getElementById("who").textContent = c.display_name;
  document.getElementById("role").textContent = [c.title, (c.affiliations || [])[0]].filter(Boolean).join(", ");
  if (c.version) document.getElementById("ver").textContent = "Version " + c.version;
</script>
</body>
</html>
